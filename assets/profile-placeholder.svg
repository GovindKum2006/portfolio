<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Geometric Tech Grid Background -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.3" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" />
  <circle cx="200" cy="200" r="100" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Circuit nodes -->
  <circle cx="90" cy="110" r="4" fill="#38bdf8" opacity="0.7" />
  <line x1="90" y1="110" x2="130" y2="150" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
  <circle cx="310" cy="120" r="4" fill="#c084fc" opacity="0.7" />
  <line x1="310" y1="120" x2="270" y2="160" stroke="#c084fc" stroke-width="1" opacity="0.4" />
  <circle cx="110" cy="300" r="4" fill="#6366f1" opacity="0.6" />
  <line x1="110" y1="300" x2="150" y2="280" stroke="#6366f1" stroke-width="1" opacity="0.3" />
  <circle cx="300" cy="290" r="4" fill="#38bdf8" opacity="0.6" />
  <line x1="300" y1="290" x2="260" y2="270" stroke="#38bdf8" stroke-width="1" opacity="0.3" />

  <!-- Outer Glow Hexagon / Portal -->
  <polygon points="200,60 320,130 320,270 200,340 80,270 80,130" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" filter="url(#glowEffect)" opacity="0.8"/>

  <!-- Central Silhouette / Avatar Badge -->
  <g transform="translate(200, 195)">
    <!-- Head -->
    <circle cx="0" cy="-35" r="42" fill="url(#primaryGrad)" opacity="0.9" />
    
    <!-- Hair / Sleek Cut styling -->
    <path d="M -42,-40 C -45,-75 45,-75 42,-40 C 40,-15 35,-10 32,-5 C 28,-18 20,-30 0,-30 C -20,-30 -28,-18 -32,-5 C -35,-10 -40,-15 -42,-40 Z" fill="#0f172a" opacity="0.75" />
    
    <!-- Torso / Shoulders -->
    <path d="M -75,65 C -75,20 -40,12 0,12 C 40,12 75,20 75,65 Z" fill="url(#primaryGrad)" opacity="0.9" />
    
    <!-- Tech Core Badge on chest -->
    <polygon points="0,25 15,35 0,45 -15,35" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Elegant Bottom Label -->
  <rect x="90" y="325" width="220" height="36" rx="18" fill="#0b0f19" stroke="url(#ringGrad)" stroke-width="1.5" />
  <text x="200" y="348" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="1.5">DEEPALI CHOUKSEY</text>
</svg>
